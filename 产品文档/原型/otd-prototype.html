<!doctype html>
<html lang="zh-CN" data-theme="brand-red">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTD 订单交付平台 · 原型</title>


<style>
:root{
  --primary:#B5121B;--primary-soft:#FBE9EA;--primary-ink:#FFFFFF;
  --sidebar-from:#3A1418;--sidebar-to:#5A1F24;
  --sb-text:rgba(255,255,255,.74);--sb-text-strong:#FFFFFF;--sb-hover:rgba(255,255,255,.08);--sb-active-bg:var(--primary);--sb-active-text:#FFFFFF;--sb-line:rgba(255,255,255,.08);
  --bg:#F3F4F6;--surface:#FFFFFF;--surface-2:#F7F8FA;--text:#1F2329;--text-2:#646A73;--text-3:#8F959E;--border:#E5E7EB;
  --success:#1F9D55;--warning:#D97706;--danger:#DC2626;--info:#2563EB;
  --radius:10px;--sb-w:220px;--sb-w-c:64px;--top-h:56px;--pad:24px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px -6px rgba(16,24,40,.08);
  --shadow-lg:0 24px 60px -20px rgba(16,24,40,.35);
  --scrim:rgba(15,17,21,.45);
  --fab-size:56px;
  --f-ui:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --f-num:"DIN Alternate","Roboto Condensed","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
html[data-theme="tech-blue"]{--primary:#2563EB;--primary-soft:#E6EEFD;--sidebar-from:#101B33;--sidebar-to:#1B2D55}
html[data-theme="pine-green"]{--primary:#2F8F5B;--primary-soft:#E4F3EA;--sidebar-from:#10241A;--sidebar-to:#1C3A2A}
html[data-theme="amber-gold"]{--primary:#A87A1E;--primary-soft:#F7EFDC;--sidebar-from:#2A2112;--sidebar-to:#43341A}
html[data-theme="navy"]{--primary:#2C4A7A;--primary-soft:#E5EAF3;--sidebar-from:#121C30;--sidebar-to:#1F2F4D}
html[data-theme="minimal-white"]{--primary:#C8102E;--primary-soft:#FBE7EA;--sidebar-from:#FFFFFF;--sidebar-to:#FFFFFF;--bg:#FAFAFA;
  --sb-text:#4B5058;--sb-text-strong:#1F2329;--sb-hover:#F3F4F6;--sb-active-bg:var(--primary-soft);--sb-active-text:var(--primary);--sb-line:#EEF0F2}
html[data-theme="dark"]{--primary:#E5484D;--primary-soft:#3A1D20;--sidebar-from:#0B0D11;--sidebar-to:#12151B;
  --bg:#0F1115;--surface:#171A21;--surface-2:#1D2129;--text:#E6E8EB;--text-2:#9AA0A8;--text-3:#6B717A;--border:#262A33;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--primary);text-decoration:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.danger{color:var(--danger)}
.ok{color:var(--success)}
.warn{color:var(--warning)}
.strong{font-weight:700}
.nowrap{white-space:nowrap}

.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);background:var(--bg)}
.login-art{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--sidebar-from),var(--sidebar-to));color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
html[data-theme="minimal-white"] .login-art{background:linear-gradient(140deg,#2A2D33,#3B1A20)}
.login-art svg.knit{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.brand{display:flex;align-items:center;gap:12px;position:relative}
.logo{width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font:700 15px var(--f-num);letter-spacing:.04em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);flex:none}
.brand-name{font-weight:700;font-size:16px;line-height:1.2}
.brand-sub{font-size:11px;opacity:.7;letter-spacing:.08em}
.login-hero{position:relative;max-width:560px}
.login-hero h1{font-size:clamp(32px,4.2vw,52px);line-height:1.12;margin:0 0 14px;letter-spacing:-.01em}
.login-hero h1 em{font-style:normal;font-family:var(--f-num);font-weight:700;color:#fff;background:var(--primary);padding:0 10px;border-radius:8px;margin-right:8px}
.login-hero p{font-size:16px;opacity:.82;margin:0}
.login-feats{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:640px}
.login-feat{border-top:1px solid rgba(255,255,255,.22);padding-top:12px}
.login-feat b{display:block;font-size:14px}
.login-feat span{font-size:12px;opacity:.7}
.login-form-wrap{display:grid;place-items:center;padding:32px 20px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;box-shadow:var(--shadow-lg)}
.login-card h2{margin:0 0 4px;font-size:22px}
.login-card .lang-switch{float:right}
.field-in{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field-in label{font-size:12px;color:var(--text-2)}
.input,.select,.textarea{width:100%;height:38px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:0 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{height:auto;padding:10px 12px;resize:vertical;min-height:72px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.demo-accts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--text-2);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}

.shell{min-height:100vh}
.sb{position:fixed;inset:0 auto 0 0;width:var(--sb-w);background:linear-gradient(180deg,var(--sidebar-from),var(--sidebar-to));color:var(--sb-text);display:flex;flex-direction:column;z-index:40;transition:width .2s,transform .25s;border-right:1px solid var(--sb-line)}
.sb-brand{height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--sb-line);flex:none}
.sb-brand .logo{width:32px;height:32px;font-size:12px;border-radius:8px}
.sb-brand .brand-name{color:var(--sb-text-strong);font-size:14px;white-space:nowrap}
.sb-brand .brand-sub{font-size:10px}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px 24px;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:6px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--sb-line);border-radius:3px}
.nav-item,.nav-group>button{width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--sb-text);font-size:13px;text-align:left;white-space:nowrap;transition:background .15s,color .15s}
.nav-item:hover,.nav-group>button:hover{background:var(--sb-hover);color:var(--sb-text-strong)}
.nav-item.active{background:var(--sb-active-bg);color:var(--sb-active-text);font-weight:600;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--primary) 70%,transparent)}
.nav-ico{width:18px;height:18px;flex:none;display:grid;place-items:center}
.nav-ico svg{width:16px;height:16px}
.nav-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-caret{width:12px;height:12px;transition:transform .2s;opacity:.6}
.nav-group.open .nav-caret{transform:rotate(90deg)}
.nav-sub{display:none;padding:2px 0 4px}
.nav-group.open .nav-sub{display:block}
.nav-sub .nav-item{height:32px;padding-left:38px;font-size:12.5px}
.nav-code{font:600 10px var(--f-num);opacity:.5;letter-spacing:.04em}
.shell.collapsed .sb{width:var(--sb-w-c)}
.shell.collapsed .sb .nav-label,.shell.collapsed .sb .nav-caret,.shell.collapsed .sb .nav-sub,.shell.collapsed .sb .brand-txt,.shell.collapsed .sb .nav-code{display:none}
.shell.collapsed .sb .nav-item,.shell.collapsed .sb .nav-group>button{justify-content:center;padding:0}
.top{position:fixed;top:0;right:0;left:var(--sb-w);height:var(--top-h);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:30;transition:left .2s}
.shell.collapsed .top{left:var(--sb-w-c)}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font:600 10px/16px var(--f-num);padding:0 4px;text-align:center}
.search{flex:1;max-width:360px;position:relative}
.search input{width:100%;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);padding:0 12px 0 34px;outline:none}
.search input:focus{border-color:var(--primary);background:var(--surface)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--text-3)}
.top-spacer{flex:1}
.top-lang{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:13px;white-space:nowrap}
.top-lang:hover{background:var(--surface-2)}
.user-btn{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:10px}
.user-btn:hover{background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.user-meta{text-align:left;line-height:1.2}
.user-meta b{display:block;font-size:13px}
.user-meta span{font-size:11px;color:var(--text-2)}
.dropdown{position:absolute;top:calc(var(--top-h) - 6px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:60;min-width:200px;padding:6px;animation:pop .14s ease-out}
.dropdown .dd-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left}
.dropdown .dd-item:hover{background:var(--surface-2)}
.dd-note{padding:10px;border-radius:8px;display:grid;grid-template-columns:8px 1fr;gap:10px;cursor:pointer}
.dd-note:hover{background:var(--surface-2)}
.dd-note i{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--danger)}
.dd-note b{font-size:13px;font-weight:600;display:block}
.dd-note span{font-size:12px;color:var(--text-2)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.main{margin-left:var(--sb-w);padding:calc(var(--top-h) + var(--pad)) var(--pad) 64px;transition:margin-left .2s;min-width:0}
.shell.collapsed .main{margin-left:var(--sb-w-c)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:35;display:none}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.crumbs{font-size:12px;color:var(--text-3);margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--text-3)}
.crumbs a:hover{color:var(--primary)}
.ph h1{margin:0;font-size:20px;line-height:1.3;display:flex;align-items:center;gap:10px}
.ph h1::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--primary);flex:none}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:color-mix(in srgb,var(--primary) 50%,var(--border));color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{color:var(--primary-ink);filter:brightness(1.08)}
.btn-soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.link{color:var(--primary);font-weight:500;cursor:pointer;white-space:nowrap}
.link:hover{text-decoration:underline}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card+.card,.stack>*+*{margin-top:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--text-2);font-weight:400;margin-left:8px}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}
.grid{display:grid;gap:16px}
.g-main{grid-template-columns:minmax(0,1fr) 320px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-org{grid-template-columns:280px minmax(0,1fr)}
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.donut svg{width:150px;height:150px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi-l{font-size:12px;color:var(--text-2);display:flex;justify-content:space-between;gap:8px}
.kpi-v{font:600 30px/1.15 var(--f-num);margin-top:6px;letter-spacing:.01em}
.kpi-v small{font-size:13px;font-family:var(--f-ui);font-weight:500;color:var(--text-2);margin-left:4px}
.kpi-s{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-bar{height:4px;border-radius:2px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.kpi-bar i{display:block;height:100%;background:var(--primary);border-radius:2px}
.kpi.tone-danger .kpi-v{color:var(--danger)}
.kpi.tone-warning .kpi-v{color:var(--warning)}
.kpi.tone-success .kpi-v{color:var(--success)}
.kpi.tone-primary .kpi-v{color:var(--primary)}
.kpi-ico{position:absolute;right:14px;bottom:14px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.kpi-ico svg{width:18px;height:18px}

.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--text-2);border:1px solid transparent;line-height:1}
.tag.t-success{background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--success)}
.tag.t-warning{background:color-mix(in srgb,var(--warning) 13%,transparent);color:var(--warning)}
.tag.t-danger{background:color-mix(in srgb,var(--danger) 11%,transparent);color:var(--danger)}
.tag.t-info{background:color-mix(in srgb,var(--info) 11%,transparent);color:var(--info)}
.tag.t-primary{background:var(--primary-soft);color:var(--primary)}
.tag.t-line{background:transparent;border-color:var(--border);color:var(--text-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.red{background:var(--danger)}.dot.amber{background:var(--warning)}.dot.green{background:var(--success)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--text-2);background:var(--surface-2);padding:10px 14px;white-space:nowrap;border-bottom:1px solid var(--border);font-size:12px}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--primary) 4%,transparent)}
.tbl tr.clickable{cursor:pointer}
.tbl .r{text-align:right}
.cell-2 b{display:block;font-weight:600}
.cell-2 span{font-size:12px;color:var(--text-2)}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none;border:1px solid var(--border)}
.thumb svg{width:34px;height:34px}
.pdf{font:700 10px var(--f-num);color:var(--text-3)}
.prog{display:flex;flex-direction:column;gap:4px;min-width:120px}
.prog-bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--primary)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;color:var(--text-2);font-size:12px;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap}
.pager .pg{display:flex;gap:6px;align-items:center}
.pager .pg b{width:26px;height:26px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;font:600 12px var(--f-num)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .select,.filters .input{height:32px;width:auto;min-width:130px;font-size:13px}

.hero{display:grid;grid-template-columns:220px minmax(0,1fr);border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.hero-img{background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;border-right:1px solid var(--border)}
.hero-img svg{width:150px;height:150px}
.hero-img span{font-size:11px;color:var(--text-3)}
.hero-body{padding:18px 22px;min-width:0;background:linear-gradient(115deg,color-mix(in srgb,var(--primary) 6%,var(--surface)) 0,var(--surface) 46%)}
.hero-title{font-size:18px;font-weight:700;margin:8px 0 2px;line-height:1.35}
.hero-sub{font-size:12px;color:var(--text-2);margin-bottom:14px}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px}
.fields.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.f{min-width:0}
.f-l{font-size:12px;color:var(--text-3);margin-bottom:2px}
.f-v{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.f.wide{grid-column:span 2}
.f.full{grid-column:1/-1}
.note{font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;line-height:1.7}
.note.warn{background:color-mix(in srgb,var(--warning) 10%,transparent);color:color-mix(in srgb,var(--warning) 70%,var(--text))}
.note.bad{background:color-mix(in srgb,var(--danger) 9%,transparent);color:color-mix(in srgb,var(--danger) 80%,var(--text))}

.tl{position:relative;padding:4px 0}
.tl-step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;position:relative;padding-bottom:14px}
.tl-step:last-child{padding-bottom:0}
.tl-step::before{content:"";position:absolute;left:17px;top:30px;bottom:-2px;border-left:2px dashed color-mix(in srgb,var(--primary) 35%,var(--border))}
.tl-step:last-child::before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font:600 13px var(--f-num);margin:6px 0 0 4px;position:relative;z-index:1;box-shadow:0 0 0 4px var(--surface)}
.tl-step.s-todo .tl-dot,.tl-step.s-na .tl-dot{background:var(--surface-2);color:var(--text-3);border:1px solid var(--border)}
.tl-step.s-block .tl-dot{background:var(--danger)}
.tl-step.s-doing .tl-dot{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 4px var(--surface),0 0 0 4px color-mix(in srgb,var(--primary) 40%,transparent)}70%{box-shadow:0 0 0 4px var(--surface),0 0 0 12px transparent}100%{box-shadow:0 0 0 4px var(--surface),0 0 0 4px transparent}}

.chart{width:100%;display:block}

.empty{padding:56px 20px;text-align:center;color:var(--text-2)}

.line-tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto}

.modal-wrap{position:fixed;inset:0;background:var(--scrim);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .15s}

.msg.me{align-self:flex-end;background:var(--primary);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px}

.bot-card{border:1px solid var(--border);border-radius:14px;padding:16px;background:var(--surface)}

.src{font-size:11px;color:var(--text-3);margin-top:10px;padding-top:8px;border-top:1px dashed var(--border)}
.typing{display:inline-flex;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.chat-input{border-top:1px solid var(--border);padding:12px 16px}

.fab:hover{transform:translateY(-2px) scale(1.04)}
.fab svg{width:46%;height:46%}
.fab::after{content:attr(data-tip);position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--text);color:var(--surface);font-size:12px;padding:4px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}

const shell=content=>{const u=ME();const act=activeMenu();const nav=MENU.filter(m=>!u.hide.includes(m.id)).map(m=>{if(!m.sub)return `<a class="nav-item ${act.mid===m.id?'active':''}" href="${m.go}" title="${L(m.t)}"><span class="nav-ico">${ico(m.ico)}</span><span class="nav-label">${L(m.t)}</span></a>`;const subs=m.sub.filter(s=>!s[2]||u.boards.includes(s[2]));const open=S.open[m.id]!=null?S.open[m.id]:act.mid===m.id;return `<div class="nav-group ${open?'open':''}"><button data-act="group" data-id="${m.id}" title="${L(m.t)}"><span class="nav-ico">${ico(m.ico)}</span><span class="nav-label">${L(m.t)}</span><span class="nav-code">${m.id}</span>${ico('caret','nav-caret')}</button><div class="nav-sub">${subs.map(s=>`<a class="nav-item ${act.href===s[1]?'active':''}" href="${s[1]}">${L(s[0])}</a>`).join('')}</div></div>`}).join('');
const dd=S.dd==='notes'?`<div class="dropdown" style="right:150px;width:340px"><div style="display:flex;justify-content:space-between;padding:6px 10px"><b>${L('通知|Notifications')}</b><a class="link" data-act="toast" data-msg="已全部标为已读|All marked read">${L('全部已读|Mark all read')}</a></div>${NOTES.map(n=>`<div class="dd-note" data-go="${n[2]}"><i></i><div><b>${L(n[0])}</b><span>${L(n[1])}</span></div></div>`).join('')}</div>`:S.dd==='user'?`<div class="dropdown" style="right:12px"><div style="padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:4px"><b>${L(u.name)}</b><div class="muted" style="font-size:12px">${u.code} · ${L(u.role)}<br>${L('数据范围|Scope')}：${L(u.scope)}</div></div><button class="dd-item" data-act="settings">${ico('palette')}${L('个人设置|Preferences')}</button><button class="dd-item" data-act="lang">${ico('globe')}${S.lang==='zh'?'English':'简体中文'}</button><button class="dd-item" data-act="logout">${ico('out')}${L('退出登录|Sign out')}</button></div>`:'';
const fab=S.fab.show&&parseHash()[0]!=='ai'?`<a class="fab" href="#/ai" data-tip="${L('OTD 助手|OTD assistant')}" aria-label="assistant">${ico('bot')}</a>`:'';
return `<div class="shell ${S.collapsed?'collapsed':''} ${S.drawer?'drawer':''}"><aside class="sb"><div class="sb-brand"><div class="logo">OTD</div><div class="brand-txt"><div class="brand-name">${L('OTD 订单交付平台|OTD Delivery')}</div><div class="brand-sub">ORDER TO DELIVERY</div></div></div><nav class="sb-nav">${nav}</nav></aside><div class="scrim" data-act="close-drawer"></div><header class="top"><button class="icon-btn" data-act="toggle-sb" aria-label="menu">${ico('menu')}</button><div class="search">${ico('search')}<input id="g-search" placeholder="${L('搜索订单号、款号、单号…|Search PO, style, record…')}"></div><div class="top-spacer"></div><button class="icon-btn" data-act="dd" data-k="notes" aria-label="notifications">${ico('bell')}<span class="badge">${NOTES.length+33}</span></button><button class="top-lang" data-act="lang">${ico('globe')}<span>${S.lang==='zh'?'简体中文':'English'}</span></button><button class="user-btn" data-act="dd" data-k="user"><span class="avatar">${L(u.name).slice(0,1)}</span><span class="user-meta"><b>${L(u.name)}</b><span>${L(u.role)}</span></span></button>${dd}</header><main class="main">${content}</main>${fab}</div>`};
const routeMod=(r,a)=>{if(r==='dash')return 'M17';if(r==='ph')return PH[a]?PH[a][0]:'';if(r==='ai')return 'M01';if(r==='todo')return 'M00';if(r==='monitor')return 'M09';const m=ROUTE_MENU.find(x=>x[0]===r);return m?m[1]:''};
const route=(r,a,b)=>{if(r==='stub')return stub(a,b);if(r==='login')return P.todo();if(P[r]&&r!=='login')return P[r](a,b);return notFound(r)};
let lastHash=null;
const render=()=>{applyTheme();const app=document.getElementById('app');if(!S.user){document.title=L('OTD 订单交付平台 · 原型|OTD Order Delivery · Prototype');app.innerHTML=P.login();return}let [r,a,b]=parseHash();if(!r){r='todo'}const mod=routeMod(r,a);let html;try{html=mod&&ME().hide.includes(mod)?denied():route(r,a,b)}catch(err){html=notFound(r);console.error(err)}const nav=document.querySelector('.sb-nav');const sc=nav?nav.scrollTop:0;app.innerHTML=shell(html);const nav2=document.querySelector('.sb-nav');if(nav2)nav2.scrollTop=sc;if(lastHash!==location.hash){window.scrollTo(0,0);lastHash=location.hash;const h1=document.querySelector('.ph h1');document.title=(h1?h1.textContent+' · ':'')+L('OTD 订单交付平台|OTD Order Delivery')}};
const refreshModal=fn=>{const m=document.getElementById('modal');if(!m)return;const b=m.querySelector('.modal-b');const sc=b?b.scrollTop:0;m.querySelector('.modal').innerHTML=fn();const b2=m.querySelector('.modal-b');if(b2)b2.scrollTop=sc};
const addBrief=()=>{if(!STY['12812'])STY['12812']={zh:'提花菱格中筒袜',en:'Argyle Jacquard Crew',cust:'NSR',season:'FA27',cat:'女袜 · Crew',c1:'#5B4B8A',c2:'#E8E2F4'};let b=BRIEFS.find(x=>x.no==='BR-2610-022');if(!b){b={no:'BR-2610-022',style:'12812',st:'提取完成',t:'2026-10-21 '+hhmm()};BRIEFS.unshift(b)}return b};
const globalSearch=q=>{q=(q||'').trim().toUpperCase();if(!q)return;let m;if((m=q.match(/PO\d{7}/))){const po=m[0];location.hash=ORDERS.find(o=>o.po===po)?'#/order/'+po:'#/monitor/'+po;return}if((m=q.match(/^#?(\d{5})$/))){const b=BRIEFS.find(x=>x.style===m[1]);if(b){location.hash='#/brief/'+b.no;return}}const rich=['INSP-2610-020','SH-2610-001','QT-12593-04','PK-2610-009'];const pre=[['BR-','brief',BRIEFS.map(b=>b.no)],['SP-','sample',SAMPLES.map(s=>s.no)],['TST-','test',TESTS.map(t=>t.no)],['QT-','quote',['QT-12593-04','QT-11506-03','QT-11151-02','QT-12744-02','QT-12750-01']],['PK-','pack',['PK-2610-009','PK-2610-015','PK-2609-021','PK-2608-014','PK-2610-018']],['INSP-','insp',INSPS.map(i=>i.no)],['SH-','ship',SHIPS.map(s=>s.no)],['BK-','ship',SHIPS.map(s=>s.no)],['SYN-','sync',SYNCS.map(s=>s[0])]];for(const p of pre){if(q.startsWith(p[0])&&p[2].includes(q)){location.hash=['insp','ship','quote','pack'].includes(p[1])&&!rich.includes(q)?'#/stub/'+p[1]+'/'+q:'#/'+p[1]+'/'+q;return}}toast('没有找到「'+q+'」，可输入 PO 号、款号或单号|Nothing found for “'+q+'”. Try a PO, style or record number','bad')};

const ACT={
  login:()=>{const ph=(document.getElementById('lg-phone')||{}).value||'',pw=(document.getElementById('lg-pwd')||{}).value||'';const acc=Object.values(ACCOUNTS).find(a=>a.phone===ph.replace(/\s/g,''));if(!ph||!pw){toast('请输入手机号和密码，或点下方演示账号|Enter phone and password, or pick a demo account','bad');return}S.user=acc?acc.key:'admin';LS.set('user',S.user);S.open={};lastHash=null;const target=ME().key==='gm'?'#/dash/gm':'#/todo';if(location.hash===target)render();else location.hash=target;toast(L('欢迎回来，|Welcome back, ')+L(ME().name),'good')},
  demo:a=>{const acc=ACCOUNTS[a.dataset.k];document.getElementById('lg-phone').value=acc.phone;document.getElementById('lg-pwd').value='demo1234';document.querySelectorAll('.demo-accts .chip').forEach(c=>c.classList.toggle('on',c===a))},
  forgot:()=>toast('请联系系统管理员重置密码|Ask your system admin to reset the password'),
  logout:()=>{S.user=null;LS.set('user',null);S.dd=null;S.chat=[];history.replaceState(null,'',location.pathname+location.search);render()},
  lang:()=>{S.lang=S.lang==='zh'?'en':'zh';LS.set('lang',S.lang);S.dd=null;render();refreshModal(settingsModal)},
  'set-lang':a=>{S.lang=a.dataset.l;LS.set('lang',S.lang);render();refreshModal(settingsModal)},
  'toggle-sb':()=>{if(window.innerWidth<=768){S.drawer=!S.drawer}else{S.collapsed=!S.collapsed}const sh=document.querySelector('.shell');sh.classList.toggle('collapsed',S.collapsed);sh.classList.toggle('drawer',S.drawer)},
  'close-drawer':()=>{S.drawer=false;document.querySelector('.shell').classList.remove('drawer')},
  group:a=>{const id=a.dataset.id;const g=a.parentElement;const open=!g.classList.contains('open');S.open[id]=open;g.classList.toggle('open',open);if(S.collapsed&&window.innerWidth>768){S.collapsed=false;document.querySelector('.shell').classList.remove('collapsed')}},
  dd:a=>{S.dd=S.dd===a.dataset.k?null:a.dataset.k;render()},
  settings:()=>{S.dd=null;render();openModal(settingsModal())},
  theme:a=>{S.theme=a.dataset.t;S.custom=null;LS.set('theme',S.theme);LS.set('custom',null);applyTheme();refreshModal(settingsModal)},
  'reset-theme':()=>{S.theme='brand-red';S.custom=null;LS.set('theme',S.theme);LS.set('custom',null);applyTheme();refreshModal(settingsModal)},
  'fab-show':()=>{S.fab.show=!S.fab.show;LS.set('fab',S.fab);render();refreshModal(settingsModal)},
  'close-modal':()=>closeModal(),
  toast:a=>toast(a.dataset.msg),
  handover:()=>toast('开发移交包已冻结：样品、报价、测试、QRS、技术资料包五项齐套；之后改动走变更审批|Handover package frozen; later changes go through change approval'),
  'mon-search':()=>{const v=(document.getElementById('mon-q').value||'').trim().toUpperCase();location.hash=v?'#/monitor/'+v:'#/monitor'},
  'import-brief':()=>openModal(importModal(0)),
  'import-pick':()=>{openModal(importModal(1));const msgs=[L('上传完成，正在识别版面与表格…|Uploaded, reading layout & tables…'),L('已提取 12 个字段，正在英译中…|12 fields extracted, translating…'),L('翻译完成，原文与图片已保留|Translated, originals kept')];[0,1,2].forEach(i=>setTimeout(()=>{const sp=document.querySelectorAll('#imp-steps span');if(sp[i])sp[i].classList.add('on');const m=document.getElementById('imp-msg');if(m)m.textContent=msgs[i]},400+i*650));setTimeout(()=>{if(document.getElementById('imp-steps'))openModal(importModal(2));else{addBrief();toast('BR-2610-022 要素提取完成，等待复核|BR-2610-022 extracted, awaiting review','good');if(parseHash()[0]==='briefs')render()}},2400)},
  'import-done':()=>{const b=addBrief();closeModal();location.hash='#/brief/'+b.no;toast('已生成企划 BR-2610-022，请核对后确认|Brief BR-2610-022 created, review and confirm','good')},
  'archive-brief':a=>{S.briefSt[a.dataset.no]='已归档';toast('已归档 '+a.dataset.no+'|Archived '+a.dataset.no);render()},
  'confirm-brief':a=>{S.briefSt[a.dataset.no]='已确认';const b=BRIEFS.find(x=>x.no===a.dataset.no);toast('企划已确认，已按「'+CN(STY[b.style].cust)+'」流程自动下达打样指令 SP-2610-013|Brief confirmed; sampling order SP-2610-013 issued per customer flow','good');render()},
  'new-quote':()=>{openModal(quoteModal());quoteCalc()},
  'quote-submit':()=>{const qty=+document.getElementById('q-qty').value||0,price=+document.getElementById('q-price').value||0,stg=document.getElementById('q-st').value;const usd=price/QT.fx,margin=(price-QT.cost)/price*100,diff=usd-QT.target;if(margin<QT.guard){toast('毛利低于护栏 12%，不能生成报价|Margin below 12% guardrail','bad');return}const n=QT.rounds.length+(S.quoteRounds||[]).length+1;S.quoteRounds=(S.quoteRounds||[]).concat([[`第 ${n} 轮|R${n}`,`QT-12593-0${n+1}`,price.toFixed(2),usd.toFixed(2),qty,stg,+margin.toFixed(1),(diff<0?'低|-':'高|+')+' $'+Math.abs(diff).toFixed(2),L(ME().name),'2026-10-21','新一轮报价|New round']]);closeModal();render();toast('已生成第 '+n+' 轮报价，护栏校验通过|Round '+n+' created, guardrail passed','good')},
  'order-next':a=>{const po=a.dataset.po;const o=ORDERS.find(x=>x.po===po);const st=S.orderSt[po]||o.st;const nx=ORDER_FLOW[ORDER_FLOW.indexOf(st)+1];if(!nx)return;if(po==='PO0009631'&&st==='生产中'){toast('不能推进到「待发货」：验货放行 G2 仅满足 2 / 3（终验 FRI 未合格）|Cannot move to Ready to ship: gate G2 met 2 / 3 (FRI not passed)','bad');return}S.orderSt[po]=nx;S.orderLog=(S.orderLog||[]).concat([[nx,'2026-10-21 '+hhmm(),'状态推进到「'+nx+'」|Status moved to '+ST_EN[nx],L(ME().name),po]]);if(po==='PO0010459'&&MON[po]&&nx==='待排产'){MON[po].nodes[5][0]='已完成';MON[po].nodes[6][0]='进行中';MON[po].done=6}render();toast('已推进到「'+nx+'」|Moved to '+ST_EN[nx],'good')},
  'cap-compare':()=>{S.capCompare=!S.capCompare;render()},
  'cap-tab':a=>{S.capTab=+a.dataset.i;render()},
  'insp-reinspect':a=>{S.inspSt['INSP-2610-020']='整改复验';toast('已创建第 3 轮复验，已通知品质部张磊|Round 3 re-inspection created, QA notified','good');render()},
  'insp-release':()=>toast('三条件缺一不放行：终验 FRI 尚未合格（INSP-2610-027 待排期）|All three required: FRI not passed yet','bad'),
  'ship-pod':()=>{S.shipSt['SH-2610-001']='已签收';MON.PO0009412.nodes[9][1]='SH-2610-001 已签收；应收 AR-202610-007 未到期|SH-2610-001 delivered; AR not due';render();toast('已登记签收，应收 AR-202610-007 开始按账期计算|POD recorded; AR clock started','good')},
  'col-tab':a=>{S.colTab=+a.dataset.i;render()},
  'collect-log':a=>openModal(collectModal(a.dataset.no)),
  'collect-save':a=>{const r=COLLECT.find(x=>x.no===a.dataset.no);const ch=document.getElementById('cl-ch').value.split('|'),note=document.getElementById('cl-note').value,nx=document.getElementById('cl-next').value;if(r){r.n++;r.last=`${ch[0]} · ${note}|${ch[1]} · ${note}`;r.next=nx||r.next}closeModal();render();toast('已记录催收，下次跟进 '+(nx||'—')+'|Logged, next follow-up '+(nx||'—'),'good')},
  ask:a=>chatAsk(L(AI_Q[+a.dataset.i])),
  'chat-send':()=>{const el=document.getElementById('chat-in');const v=(el&&el.value||'').trim();if(!v)return;chatAsk(v)},
  'chat-new':()=>{S.chat=[];render()},
  'chat-sess':a=>{const i=+a.dataset.i;const k=[0,2,1][i];S.chatSess=i;S.chat=[{me:L(AI_Q[k])},{bot:aiAnswer(k)}];render()},
  'flow-move':a=>{const f=flowMods(a.dataset.c);const i=+a.dataset.i,j=i+(+a.dataset.d);if(j<0||j>=f.list.length)return;const id=f.list[i];[f.list[i],f.list[j]]=[f.list[j],f.list[i]];render();const el=document.getElementById('mod-'+id);if(el){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),500)}},
  'flow-item':a=>{const f=flowMods(a.dataset.c);const m=a.dataset.m,it=a.dataset.it;const off=f.off[m]=f.off[m]||[];const k=off.indexOf(it);if(k>=0)off.splice(k,1);else off.push(it);render()},
  'flow-rm':a=>{const f=flowMods(a.dataset.c);f.list=f.list.filter(x=>x!==a.dataset.m);render();toast('已移除模块；该客户新建订单的对应节点将显示「不适用」|Module removed; related nodes show N/A for new orders')},
  'flow-add':a=>openModal(addModModal(a.dataset.c)),
  'flow-add-pick':a=>{const f=flowMods(a.dataset.c);if(!f.list.includes(a.dataset.m))f.list.push(a.dataset.m);closeModal();render();toast('已添加模块|Module added','good')},
  'patrol-run':a=>{a.disabled=true;a.innerHTML=`<span class="spin"></span>${L('巡检中…|Running…')}`;const c=document.querySelector('.patrol-card');if(c)c.classList.add('scan');setTimeout(()=>{S.patrolRun++;S.patrolMs=240+Math.floor(Math.random()*80);S.patrolTime='2026-10-21 '+hhmm();render();toast(`PT-${String(S.patrolRun).padStart(4,'0')} ${L('巡检完成：18 项规则，命中 38 条|done: 18 rules, 38 hits')}`,'good')},1200)},
  'dash-tab':a=>{S.dashTab=+a.dataset.i;render()},
  'metric-def':a=>openModal(metricModal(a.dataset.b)),
  'sync-run':()=>{toast('已开始执行，新批次 B05…|Run started, batch B05…');setTimeout(()=>toast('B05 执行完成：373 条全部成功|B05 done: 373 ok','good'),1100)},
  'sync-retry':()=>{S.syncFixed=true;S.syncLog.push(['2026-10-21 '+hhmm(),L(ME().name),'重试失败记录 2 条：成功 2 条，重试队列已清空|Retried 2 records: 2 ok, queue empty']);render();toast('重试完成，失败记录已清零|Retry done, failures cleared','good')},
  'role-perm':a=>{S.permCode=a.dataset.code;S.permDraft=JSON.parse(JSON.stringify(rolePerm(a.dataset.code)));openModal(permModal(a.dataset.code),'wide')},
  'perm-save':a=>{S.rolePerm[a.dataset.code]=S.permDraft;S.permDraft=null;S.permCode=null;closeModal();render();toast('权限已保存，并写入操作日志（关键变更，可回退）|Saved and logged as a key change','good')},
  'org-sel':a=>{S.orgSel=a.dataset.id;render()}
};
const ACTIN={
  'quote-calc':()=>quoteCalc(),
  'cap-ver':el=>{S.capVer=el.value;render()},
  'custom-color':el=>{S.custom=el.value;LS.set('custom',S.custom);applyTheme();document.querySelectorAll('.theme-card').forEach(c=>c.classList.remove('on'))},
  'fab-size':el=>{S.fab.size=+el.value;LS.set('fab',S.fab);applyTheme()},
  'perm-cust':el=>{const d=S.permDraft,k=el.dataset.k;d.cust=el.checked?Array.from(new Set(d.cust.concat(k))):d.cust.filter(x=>x!==k);refreshModal(()=>permModal(S.permCode))},
  'perm-cust-all':el=>{S.permDraft.cust=el.checked?Object.keys(CUST):[];refreshModal(()=>permModal(S.permCode))},
  'perm-group':el=>{const g=permItems().find(x=>x.id===el.dataset.g);g.items.forEach(it=>{if(el.checked)S.permDraft.menu[g.id+'|'+it]=1;else delete S.permDraft.menu[g.id+'|'+it]});refreshModal(()=>permModal(S.permCode))},
  'perm-item':el=>{if(el.checked)S.permDraft.menu[el.dataset.key]=1;else delete S.permDraft.menu[el.dataset.key];refreshModal(()=>permModal(S.permCode))}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a,e);return}const g=e.target.closest('[data-go]');if(g){const an=e.target.closest('a[href]');if(an&&g.contains(an)&&an!==g)return;closeModal();location.hash=g.dataset.go;return}if(S.dd&&!e.target.closest('.dropdown')){S.dd=null;render()}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-act-input]');if(!el||el.type==='checkbox'||el.tagName==='SELECT')return;const f=ACTIN[el.dataset.actInput];if(f)f(el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-act-input]');if(!el||(el.type!=='checkbox'&&el.tagName!=='SELECT'))return;const f=ACTIN[el.dataset.actInput];if(f)f(el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(S.dd){S.dd=null;render()}if(S.drawer)ACT['close-drawer']()}if(e.key==='Enter'&&!e.isComposing){const id=e.target.id;if(id==='mon-q'){e.preventDefault();ACT['mon-search']()}else if(id==='g-search'){e.preventDefault();globalSearch(e.target.value)}else if(id==='chat-in'&&!e.shiftKey){e.preventDefault();ACT['chat-send']()}else if(id==='lg-phone'||id==='lg-pwd'){e.preventDefault();ACT.login()}}});
window.addEventListener('hashchange',()=>{S.drawer=false;S.dd=null;render()});
if(S.user&&!ACCOUNTS[S.user])S.user=null;
render();
</script>
