<!doctype html>
<html lang="zh-CN" data-theme="brand-red">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OTD 订单交付平台</title>
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem("otd.preferences");
          var state = raw ? JSON.parse(raw).state || {} : {};
          var themes = ["brand-red", "tech-blue", "pine-green", "amber-gold", "navy-blue", "minimal-white", "night"];
          var theme = themes.indexOf(state.themeId) >= 0 ? state.themeId : "brand-red";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          if (theme === "night") root.classList.add("dark");
          if (typeof state.customPrimary === "string" && /^#[0-9a-fA-F]{6}$/.test(state.customPrimary)) {
            root.style.setProperty("--primary", state.customPrimary);
            root.style.setProperty("--ring", state.customPrimary);
            root.style.setProperty("--sidebar-primary", state.customPrimary);
          }
          if (state.locale === "en-US") root.setAttribute("lang", "en");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "brand-red");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
